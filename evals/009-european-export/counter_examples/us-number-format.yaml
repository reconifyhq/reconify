version: 1
timezone: "UTC"

sources:
  left:
    file_pattern: "inputs/left.csv"
    parser:
      type: csv
      date_col: "date"
      date_layout: "2006-01-02"
      amount_col: "amount"
      currency_col: "currency"
      ref_col: "reference"
      name_col: "description"
      multiplier: 100

  right:
    file_pattern: "inputs/right.csv"
    parser:
      type: csv
      date_col: "Booking date"
      date_layout: "02.01.2006"
      amount_col: "Amount"
      decimal: "."
      thousands: ","
      currency_col: "Currency"
      ref_col: "Reference"
      name_col: "Details"
      multiplier: 100

pairs:
  left_vs_right:
    left: left
    right: right
    date_window: "2d"
    amount_tolerance_minor: 0
