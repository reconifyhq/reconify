version: 1
timezone: "UTC"

sources:
  left:
    file_pattern: "inputs/left.csv"
    parser:
      type: csv
      date_col: "Posting Date"
      date_layout: "02-Jan-2006"
      amount_col: "Amount"
      currency_col: "Currency"
      ref_col: "Invoice"
      name_col: "Memo"
      multiplier: 100

  right:
    file_pattern: "inputs/right.json"
    parser:
      type: json
      date_col: "booked_at"
      date_layout: "2006-01-02T15:04:05Z"
      amount_col: "value"
      currency_col: "ccy"
      ref_col: "narrative"
      name_col: "narrative"
      multiplier: 100

pairs:
  left_vs_right:
    left: left
    right: right
    date_window: "1d"
    amount_tolerance_minor: 0
